group=net.paradisu.mcdevtools
id=mcdevtools
pluginName=McDevCapture
version=0.1.0
description=Development-only packet capture for the mcdevtools dev network
authors=Paradisu
url=https://github.com/Paradisu/mcdevtools

kotlin.compiler.execution.strategy=in-process

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
