[versions]
byte-buddy = "1.18.17"
gson = "2.8.9"
liquibase = "5.0.4"
junit = "6.1.3"
liquibase-slf4j = "5.1.0"
limbo = "2026.0.3-ALPHA"
mcprotocollib = "26.3-4"
netty = "4.2.16.Final"
paper-api = "26.3.build.257-stable"
postgresql = "42.7.14"
shadow = "9.6.1"
slf4j = "2.0.20"
spotless = "8.10.4"

[libraries]
byte-buddy = { group = "net.bytebuddy", name = "byte-buddy", version.ref = "byte-buddy" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
limbo = { group = "com.loohp", name = "Limbo", version.ref = "limbo" }
liquibase-core = { group = "org.liquibase", name = "liquibase-core", version.ref = "liquibase" }
liquibase-slf4j = { group = "com.mattbertolini", name = "liquibase-slf4j", version.ref = "liquibase-slf4j" }
mcprotocollib = { group = "org.geysermc.mcprotocollib", name = "protocol", version.ref = "mcprotocollib" }
netty-buffer = { group = "io.netty", name = "netty-buffer", version.ref = "netty" }
netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper-api" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
spotless = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
netty = ["netty-buffer", "netty-transport"]
liquibase = ["liquibase-core", "liquibase-slf4j", "postgresql"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
