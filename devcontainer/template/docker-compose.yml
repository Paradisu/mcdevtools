  #   command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
  #   environment:
  #     POSTGRES_DB: project
  #     POSTGRES_USER: project
  #     POSTGRES_PASSWORD: project
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
